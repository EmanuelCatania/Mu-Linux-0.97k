# Cómo se carga cada modelo de NPC (OpenNpc). El número de la sección es el
# slot del modelo, el mismo que usa `model` en monster/spawn.toml.
#
#   model       ["archivo", índice]: Data/Npc/<archivo><índice>.bmd
#   part_count  cuántas variantes tiene cada parte
#   part.X      una parte del cuerpo: la variante i va al slot <valor> + i.
#               Para cada i se cargan primero los modelos de todas las partes y
#               después sus texturas, en el orden de las líneas. Algunos slots se
#               pisan entre variantes; el orden es el del binario.
#   texture     cargar también la textura del modelo desde Data/Npc
#   marks_loaded  deja marcada la carga de modelos (DAT_0055a7c4)
#
# Los sonidos de cada NPC están en [npc.N] de audio/sound/sounds.toml.

[npc.335]   # Female
model = ["Female", 1]
part_count = 3
part.FemaleHead = 349
part.FemaleUpper = 351
part.FemaleLower = 353
part.FemaleBoots = 357

