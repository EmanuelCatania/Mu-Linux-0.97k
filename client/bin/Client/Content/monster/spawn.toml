# Cómo se crea cada tipo de monstruo o NPC (los índices de Monster.txt).
#
#   model        modelo con el que se dibuja
#   load         qué cargar antes: "monster" (OpenMonsterModel), "npc" (OpenNpc) o "none"
#   resource     el número que recibe ese loader
#   extra        otro OpenMonsterModel que hace falta además
#   scale        escala del objeto
#   right, left  arma de cada mano como [sección, índice] del item
#   right_level, left_level, right_excellent
#   blend_mesh, blend_light, subtype, hidden_mesh   campos del objeto
#   level        CHARACTER::Level (el binario lo usa como estado de animación)
#   blood        CHARACTER::Blood
#   init         ajuste que no entra en estos campos: una función de Monster.cpp
#
# Un tipo sin sección usa el modelo 270 con OpenMonsterModel(0).

