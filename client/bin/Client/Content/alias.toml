# Alias de rutas (Platform/ContentLayers.h): el cliente sigue pidiendo las
# rutas de Data y esta tabla dice dónde quedaron en el orden nuevo. Las claves
# son relativas al interior de Data; los valores, al de Content (y de cada pack
# o carpeta de server). Si dos claves coinciden gana la más larga.

[alias]
# Música separada por uso: temas de mapa, cortinas de eventos y pantallas.
"Music" = "audio/music/map"
"Music/devil_square_intro.mp3" = "audio/music/event/devil_square_intro.mp3"
"Music/devil_square_outro.mp3" = "audio/music/event/devil_square_outro.mp3"
"Music/DuelArena.mp3" = "audio/music/event/DuelArena.mp3"
"Music/PK_Field.mp3" = "audio/music/event/PK_Field.mp3"
"Music/login_theme.mp3" = "audio/music/screen/login_theme.mp3"
"Music/main_theme.mp3" = "audio/music/screen/main_theme.mp3"
"Music/MuTheme.mp3" = "audio/music/screen/MuTheme.mp3"

# Mapas: WorldN = terreno, ObjectN = objetos del mapa N-1 (como Data/Maps del server).
# Blood Castle 1..6 comparte una carpeta, como en el binario (Object12/World12).
"World1" = "map/00-Lorencia/terrain"
"Object1" = "map/00-Lorencia/objects"
"World2" = "map/01-Dungeon/terrain"
"Object2" = "map/01-Dungeon/objects"
"World3" = "map/02-Devias/terrain"
"Object3" = "map/02-Devias/objects"
"World4" = "map/03-Noria/terrain"
"Object4" = "map/03-Noria/objects"
"World5" = "map/04-LostTower/terrain"
"Object5" = "map/04-LostTower/objects"
"World6" = "map/05-Exile/terrain"
"Object6" = "map/05-Exile/objects"
"World7" = "map/06-Arena/terrain"
"Object7" = "map/06-Arena/objects"
"World8" = "map/07-Atlans/terrain"
"Object8" = "map/07-Atlans/objects"
"World9" = "map/08-Tarkan/terrain"
"Object9" = "map/08-Tarkan/objects"
"World10" = "map/09-DevilSquare/terrain"
"Object10" = "map/09-DevilSquare/objects"
"World11" = "map/10-Icarus/terrain"
"Object11" = "map/10-Icarus/objects"
"World12" = "map/11-BloodCastle/terrain"
"Object12" = "map/11-BloodCastle/objects"

# Interfaz: login y seleccion de personaje, HUD y ventanas; sonidos.
"Logo" = "ui/login"
"Interface" = "ui/interface"
"Sound" = "audio/sound"

# Sprites de efectos (los modelos de Data/Skill van por entidad en effect/model).
"Effect" = "effect/sprite"

# Data/Local repartido. Font/, Enc1.dat/Dec2.dat y Macro.txt quedan en Data (lo
# mínimo para arrancar).
#
# Textos: una carpeta por idioma con los nombres sin sufijo. Text.bmd y
# Dialog.bmd (sin idioma) eran copias del español: apuntan a esos.
"Local/Text.bmd" = "text/spn/Text.bmd"
"Local/Text_Spn.bmd" = "text/spn/Text.bmd"
"Local/Text_Eng.bmd" = "text/eng/Text.bmd"
"Local/Text_Por.bmd" = "text/por/Text.bmd"
"Local/Dialog.bmd" = "text/spn/Dialog.bmd"
"Local/Dialog_Spn.bmd" = "text/spn/Dialog.bmd"
"Local/Dialog_Eng.bmd" = "text/eng/Dialog.bmd"
"Local/Dialog_Por.bmd" = "text/por/Dialog.bmd"
"Local/NPCName.txt" = "text/eng/NPCName.txt"
"Local/NPCName(kor).txt" = "text/kor/NPCName.txt"
# Filtro de palabras del chat y de nombres de personaje.
"Local/Filter.bmd" = "text/filter/Filter.bmd"
"Local/FilterName.bmd" = "text/filter/FilterName.bmd"
# Tablas con su tema. item.bmd, skill.bmd y Gate.bmd son además el respaldo de
# lo que manda el server en el catálogo (si lo manda, gana el catálogo).
"Local/item.bmd" = "item/item.bmd"
"Local/skill.bmd" = "skill/skill.bmd"
"Local/quest.bmd" = "quest/quest.bmd"
"Local/Loading01.ozj" = "ui/loading/Loading01.ozj"
"Local/Loading02.ozj" = "ui/loading/Loading02.ozj"
"Local/Loading03.ozj" = "ui/loading/Loading03.ozj"
"Local/Webzenlogo.ozj" = "ui/loading/Webzenlogo.ozj"
"Local/Everyone.OZJ" = "ui/loading/Everyone.OZJ"
"Gate.bmd" = "map/Gate.bmd"

# Great Dragon: el catálogo lo pide en Player/Custom/21 y el cargador de sets en
# Player/. Es una sola carpeta (set/21-GreatDragon); hide y level_man01 de esa
# carpeta son versiones propias del set y sólo se usan por esta ruta.
"Player/Custom/21" = "set/21-GreatDragon"
