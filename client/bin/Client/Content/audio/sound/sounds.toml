# Sonidos con id: el número es el slot que usan PlayBuffer y la tabla de
# sonidos de cada modelo. Cada línea es id = ["archivo", canales] y, si el
# sonido es 3D, un tercer valor true. Los archivos se buscan en Data/Sound (o
# donde lo mande alias.toml).
#
# [sound] se carga al arrancar. [monster.N] se carga la primera vez que se abre
# el modelo del monstruo de tipo N; dos tipos pueden repetir la misma lista.
# [npc.N] se carga con el modelo de NPC N (npc/models.toml).
# [map.N] se carga al entrar al mapa N, con sus modelos (map/maps.toml).

