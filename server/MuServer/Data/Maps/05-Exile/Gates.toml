# Exile (mapa 5): gates.
#
# index    número de la gate. No se cambia: lo usan el cliente (Gate.bmd),
#          Move.txt y el dead_gate de los Map.toml
# type     "entrance" (pisarla lleva a `target`), "exit" (donde aparece
#          quien llega) o "destination" (sólo destino: /move, revivir)
# area     [x, y, tx, ty]
# target   gate a la que lleva una entrada
# dir      hacia dónde mira el personaje al llegar (0 a 7)
# level    [mínimo, máximo] de nivel para usarla; -1 = sin límite
# reset    [mínimo, máximo] de resets; sin la clave, sin límite
# account  nivel de cuenta mínimo; sin la clave, 0

gate = [
  { index = 79, type = "exit", area = [10, 244, 12, 246], level = [0, 400] },
]
