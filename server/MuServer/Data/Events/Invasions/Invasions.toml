# Invasiones: cuándo salen, cuánto duran y qué monstruos traen.
#
# index      número de la invasión (el de /invasionstart)
# schedule   horarios "HH:MM:SS" (con * para cualquiera), o
#            { time = "HH:MM:SS", dow, day, month, year } para fijar el día;
#            dow: 1 = domingo ... 7 = sábado
# duration   minutos que dura; warning: minutos de aviso antes de empezar
# effect     1 = dragones rojos volando, 3 = dragones dorados
# boss       monstruo jefe (su muerte manda el mensaje `boss`)
# messages   números de mensaje de Message_*.txt (sin uno, no se avisa)
# groups     al empezar, de cada grupo se elige un mapa al azar y salen ahí
#            todos sus monstruos. Un mapa es un número o { map, value }:
#            `value` elige qué puntos de Spawns.toml usa en ese mapa. Un
#            monstruo es un número o { monster, regen_type, regen_time }:
#            con regen_type 0 no reaparece hasta el final; si no, reaparece
#            regen_time segundos después de morir.
#
# Dónde aparece cada monstruo está en Spawns.toml, en esta misma carpeta.

[[invasion]]
index = 0
name = "Death King"
schedule = ["14:50:00"]
duration = 10
warning = 5
boss = 55
messages = { respawn = 19, despawn = 21, boss = 20, warning = 18 }
groups = [
  { maps = [0, 3], monsters = [55, 56] },
]

