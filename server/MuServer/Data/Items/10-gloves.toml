#   bow       = "bow" | "crossbow"                                 arco o ballesta custom
#   glow      = [R, G, B]                                            color del brillo
#   wing      = { defense = A, inc_damage = [A, B], dec_damage = [A, B] }   ala custom
#   inventory = { position = [x, y], rotation = [x, y, z], scale = s }      pose en el inventario
#   tooltip   = [ { text = "...", color = "gold" } ]                líneas propias del tooltip
#   effects   = [ { on = "equipped", type = "sprite", ... } ]        efectos sobre los huesos
#   stack     = 255  o  [ { level = 0, max = 255, create = "14,22" } ]   apilado (sólo server)
#   value     = [ { level = 0, buy = 100, sell = 20 } ]              precio (sólo server)
#   [NNN.pet]                                                        pet (el pickup es sólo server)

