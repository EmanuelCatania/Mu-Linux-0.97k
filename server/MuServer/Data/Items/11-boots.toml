#   stack     = 255  o  [ { level = 0, max = 255, create = "14,22" } ]   apilado (sólo server)
#   value     = [ { level = 0, buy = 100, sell = 20 } ]              precio (sólo server)
#   [NNN.pet]                                                        pet (el pickup es sólo server)

