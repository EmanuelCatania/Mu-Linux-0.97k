# Pet Rudolph: ejemplo de pet custom. El modelo sale de Item.txt.
# Pose del inventario del 5.2 (ZzzInventory.cpp MODEL_HELPER+67) y una línea
# propia en el tooltip. Como pet da vueltas alrededor del dueño; cuando cae zen
# cerca vuela hasta él, da vueltas encima y lo levanta (el Collecter del 5.2).
# "delay" es lo que tarda en levantarlo desde que lo elige.
[400]
inventory = { position = [0, -0.05], rotation = [270, 40, 0], scale = 0.0015 }
tooltip = [{ color = "gold", text = "Zen picker" }]

[400.pet]
abilities = [{ delay = 1500, interval = 1000, range = 3, type = "pickup", what = "zen" }]
blendMesh = 0
movement = { height = 20, period = 4000, radius = 50, type = "orbit" }
scale = 1

