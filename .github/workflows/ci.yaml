name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-windows:
    name: Client Win32
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Initialize temporary runtime
        shell: pwsh
        run: |
          $repoRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $devRoot = Split-Path (Split-Path $repoRoot -Parent) -Parent
          $runtimeRoot = Join-Path $devRoot "runtime\mu-097k"
          if (Test-Path -LiteralPath $runtimeRoot) {
            throw "Temporary runtime already exists: '$runtimeRoot'."
          }
          ./scripts/client-workflow.ps1 -Action InitializeRuntime -RuntimeRoot $runtimeRoot

      - name: Build, deploy and compare MSBuild and CMake
        shell: pwsh
        run: |
          function Assert-File([string]$Path, [string]$Description) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "$Description was not found: '$Path'."
            }
            if ((Get-Item -LiteralPath $Path).Length -eq 0) {
              throw "$Description is empty: '$Path'."
            }
          }

          function Get-PeInfo([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Artifact is not a PE image: '$Path'."
              }

              $machine = $reader.ReadUInt16()
              $sectionCount = $reader.ReadUInt16()
              $stream.Position += 12
              $optionalHeaderSize = $reader.ReadUInt16()
              $stream.Position += 2 + $optionalHeaderSize
              $sections = for ($index = 0; $index -lt $sectionCount; $index++) {
                $name = [System.Text.Encoding]::ASCII.GetString($reader.ReadBytes(8)).Trim([char]0)
                $stream.Position += 32
                $name
              }

              return [pscustomobject]@{ Machine = $machine; Sections = @($sections) }
            }
            finally {
              $stream.Dispose()
            }
          }

          function Assert-PeX86WithResources([string]$Path) {
            $pe = Get-PeInfo -Path $Path
            if ($pe.Machine -ne 0x014c) {
              throw "Expected an x86 PE image at '$Path', machine was 0x$('{0:X4}' -f $pe.Machine)."
            }
            if ($pe.Sections -notcontains ".rsrc") {
              throw "PE resource section was not found in '$Path'."
            }
          }

          function Assert-CommandFlag([object[]]$Commands, [string]$FilePattern, [string]$FlagPattern) {
            $entry = @($Commands | Where-Object file -Like $FilePattern)
            if ($entry.Count -ne 1) {
              throw "Expected one compile command matching '$FilePattern', found $($entry.Count)."
            }
            if ($entry[0].command -notmatch $FlagPattern) {
              throw "Expected flag '$FlagPattern' for '$($entry[0].file)'."
            }
          }

          $repoRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $devRoot = Split-Path (Split-Path $repoRoot -Parent) -Parent
          $runtimeRoot = Join-Path $devRoot "runtime\mu-097k"
          $mainDll = Join-Path $runtimeRoot "client\Main.dll"
          $mainPdb = Join-Path $runtimeRoot "client\Main.pdb"
          $infoEncoder = Join-Path $runtimeRoot "encoder\InfoEncoder.exe"
          $clientInfo = Join-Path $runtimeRoot "client\Data\Local\ClientInfo.bmd"

          foreach ($buildSystem in @("CMake", "MSBuild")) {
            $buildSystemArguments = if ($buildSystem -eq "CMake") {
              @{}
            }
            else {
              @{ BuildSystem = "MSBuild" }
            }

            Write-Host "Validating $buildSystem Debug."
            ./scripts/client-workflow.ps1 -Action BuildDeploy -Configuration Debug @buildSystemArguments
            Assert-File $mainDll "$buildSystem Debug Main.dll"
            Assert-File $mainPdb "$buildSystem Debug Main.pdb"
            Assert-File $infoEncoder "$buildSystem Debug InfoEncoder.exe"
            Assert-File $clientInfo "$buildSystem Debug ClientInfo.bmd"
            Assert-PeX86WithResources $mainDll
            Assert-PeX86WithResources $infoEncoder

            $firstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $clientInfo).Hash
            ./scripts/client-workflow.ps1 -Action Encode -Configuration Debug @buildSystemArguments
            $secondHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $clientInfo).Hash
            if ($firstHash -ne $secondHash) {
              throw "$buildSystem InfoEncoder output is not deterministic for identical inputs."
            }

            if ($buildSystem -eq "CMake") {
              $debugCommands = Get-Content -Raw out/build/client-windows-debug/compile_commands.json | ConvertFrom-Json
              Assert-CommandFlag $debugCommands "*/Main/Main.cpp" '(?:^|\s)[/-]MDd(?:\s|$)'
              Assert-CommandFlag $debugCommands "*/Main/Main.cpp" '(?:^|\s)/Yu'
              Assert-CommandFlag $debugCommands "*/InfoEncoder/InfoEncoder.cpp" '(?:^|\s)[/-]MTd(?:\s|$)'
              Assert-CommandFlag $debugCommands "*/InfoEncoder/InfoEncoder.cpp" '(?:^|\s)/Yu'
              $stbCommand = @($debugCommands | Where-Object file -Like "*/Main/stb.cpp")
              if ($stbCommand.Count -ne 1 -or $stbCommand[0].command -match '(?:^|\s)/Yu') {
                throw "stb.cpp must compile exactly once without the Main precompiled header."
              }
            }

            Write-Host "Validating $buildSystem Release."
            ./scripts/client-workflow.ps1 -Action BuildDeploy -Configuration Release @buildSystemArguments
            Assert-File $mainDll "$buildSystem Release Main.dll"
            Assert-File $infoEncoder "$buildSystem Release InfoEncoder.exe"
            Assert-File $clientInfo "$buildSystem Release ClientInfo.bmd"
            Assert-PeX86WithResources $mainDll
            Assert-PeX86WithResources $infoEncoder
            if (Test-Path -LiteralPath $mainPdb) {
              throw "$buildSystem Release left Debug symbols in the runtime: '$mainPdb'."
            }

            if ($buildSystem -eq "CMake") {
              $releaseCommands = Get-Content -Raw out/build/client-windows-release/compile_commands.json | ConvertFrom-Json
              Assert-CommandFlag $releaseCommands "*/Main/Main.cpp" '(?:^|\s)[/-]MD(?:\s|$)'
              Assert-CommandFlag $releaseCommands "*/Main/Main.cpp" '(?:^|\s)/GL(?:\s|$)'
              Assert-CommandFlag $releaseCommands "*/InfoEncoder/InfoEncoder.cpp" '(?:^|\s)[/-]MT(?:\s|$)'
              Assert-CommandFlag $releaseCommands "*/InfoEncoder/InfoEncoder.cpp" '(?:^|\s)/GL(?:\s|$)'
            }
          }

      - name: Reject an x64 CMake environment
        shell: pwsh
        run: |
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = (& $vsWhere -latest -products * -version "[17.0,19.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()
          $vcVarsAll = Join-Path $vsRoot "VC\Auxiliary\Build\vcvarsall.bat"
          $buildDirectory = Join-Path $env:GITHUB_WORKSPACE "out\build\client-windows-x64-rejection"
          $command = "`"$vcVarsAll`" x64 -vcvars_ver=14.44 >nul && cmake -S `"$env:GITHUB_WORKSPACE`" -B `"$buildDirectory`" -G Ninja"

          & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -eq 0) {
            throw "Client CMake configuration unexpectedly accepted an x64 compiler environment."
          }

          # The configure failure is the expected result and must not leak as the
          # final process exit code of the GitHub Actions PowerShell step.
          $global:LASTEXITCODE = 0

      - name: Clean build outputs
        if: always()
        shell: pwsh
        run: |
          ./scripts/client-workflow.ps1 -Action Clean -Configuration Debug
          ./scripts/client-workflow.ps1 -Action Clean -Configuration Release
          ./scripts/client-workflow.ps1 -Action Clean -Configuration Debug -BuildSystem MSBuild
          ./scripts/client-workflow.ps1 -Action Clean -Configuration Release -BuildSystem MSBuild

      - name: Remove temporary runtime
        if: always()
        shell: pwsh
        run: |
          $repoRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $devRoot = Split-Path (Split-Path $repoRoot -Parent) -Parent
          $runtimeBase = [System.IO.Path]::GetFullPath((Join-Path $devRoot "runtime"))
          $runtimeRoot = [System.IO.Path]::GetFullPath((Join-Path $runtimeBase "mu-097k"))
          $runtimePrefix = $runtimeBase.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar

          if (-not $runtimeRoot.StartsWith($runtimePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to remove runtime outside '$runtimeBase': '$runtimeRoot'."
          }

          if (Test-Path -LiteralPath $runtimeRoot) {
            Remove-Item -LiteralPath $runtimeRoot -Recurse -Force
          }

      - name: Verify clean worktree
        if: always()
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            $changes
            throw "Client validation modified tracked or unignored files."
          }

  server-linux:
    name: Server Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Install native server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libmysqlcppconn-dev \
            ninja-build

      - name: Verify MySQL Connector is required
        run: |
          if cmake -S . -B out/build/server-linux-without-mysql \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_MySQLConnectorCpp=TRUE; then
            echo "Server configuration unexpectedly succeeded without MySQL Connector/C++." >&2
            exit 1
          fi

      - name: Build server Debug and Release with CMake presets
        run: |
          for preset in server-linux-debug server-linux-release; do
            cmake --preset "${preset}"
            cmake --build --preset "${preset}"

            for executable in ConnectServer JoinServer DataServer GameServer; do
              artifact="out/build/${preset}/bin/${executable}"
              test -x "${artifact}"
              file "${artifact}" | grep -q 'ELF 64-bit'
            done
          done

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.editor.yaml config --quiet

      - name: Build stack images
        run: docker compose build mu-server mu-web

      - name: Start stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180 mysql mu-server mu-web

      - name: Smoke test database, server and web
        shell: bash
        run: |
          set -a
          source .env
          set +a

          tables="$(docker compose exec -T mysql mysql \
            --batch --skip-column-names \
            -uroot -p"${MYSQL_ROOT_PASSWORD}" "${MYSQL_DATABASE}" \
            -e 'SHOW TABLES')"

          for table in MEMB_INFO Character warehouse; do
            if ! grep -Fxq "${table}" <<<"${tables}"; then
              echo "Required database table was not found: ${table}" >&2
              exit 1
            fi
          done

          for service in mysql mu-server mu-web; do
            container_id="$(docker compose ps -q "${service}")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")"
            if [ "${health}" != "healthy" ]; then
              echo "Service ${service} is not healthy: ${health}" >&2
              exit 1
            fi
          done

          for port in 44405 55901; do
            if ! (echo >"/dev/tcp/127.0.0.1/${port}") 2>/dev/null; then
              echo "Server port ${port} is not reachable from the runner." >&2
              exit 1
            fi
          done

          health_response="$(curl --fail --silent --show-error http://127.0.0.1:8085/healthz)"
          if [ "${health_response}" != '{"status":"ok"}' ]; then
            echo "Unexpected web health response: ${health_response}" >&2
            exit 1
          fi

          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8085/
          docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 mysql mu-server mu-web

      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans

      - name: Verify clean worktree
        if: always()
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Server validation modified tracked or unignored files." >&2
            exit 1
          fi
