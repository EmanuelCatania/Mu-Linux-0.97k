name: Client
on:
  push:
    branches: [ "fase/*", "platform/**", "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "fase/*", "main" ]
  workflow_dispatch:
permissions:
  contents: read
# Un commit nuevo en la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: client-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
# El cliente vive en client/: todos los comandos corren ahí. Las rutas de
# upload-artifact y hashFiles no siguen este default y llevan el prefijo.
defaults:
  run:
    working-directory: client
jobs:
  # Qué carpetas tocó el cambio. Los jobs de compilación se saltean si no hace
  # falta; el job de resultado del final es el que exige la regla de main.
  changes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      # Un tag o una ejecución manual siempre compilan (artefactos de Release).
      client: ${{ steps.filter.outputs.client == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - '.github/workflows/client.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: SDL3 (${{ matrix.target.name }}, ${{ matrix.config }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: windows-x86, os: windows-2022 }
          - { name: linux-x86, os: ubuntu-22.04 }
        config: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que Mana Shield no se transfiera al reutilizar un slot
        if: matrix.config == 'Release'
        run: python -B tests/ManaShieldSlotReuse.py

      - name: Verificar identidad del héroe al retirar un anillo
        if: matrix.config == 'Release' && matrix.target.os == 'windows-2022'
        shell: pwsh
        run: python -B tests/RingHeroIdentity.py --architecture Win32
      - name: Verificar fuentes
        run: |
          python .github/scripts/check_cmake_sources.py
          python .github/scripts/check_shared_sources.py
          python .github/scripts/check_bmd_boundary.py
          python .github/scripts/check_render_layer.py
      - name: Verificar destinos de mass teleport
        if: matrix.config == 'Release'
        run: python tests/MassTeleportTarget.py
      - name: Dependencias de sistema Linux x86
        if: runner.os == 'Linux'
        run: |
          # El runner usa mirror+file: cambiar también su lista de prioridades.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib libc6-dev-i386 libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxinerama-dev:i386 libxcursor-dev:i386 libxi-dev:i386 libgl1-mesa-dev:i386 libasound2-dev:i386 libpulse-dev:i386 libwayland-dev:i386 libxkbcommon-dev:i386 libdecor-0-dev:i386 wayland-protocols ninja-build pkg-config xvfb xauth gdb libgl1-mesa-dri:i386
      - name: Verificar contrato de colision BMD (Windows x86)
        if: runner.os == 'Windows'
        run: python -B tests/BMDCollisionArguments.py --architecture Win32
      - name: Verificar contrato de colision BMD (Linux x86)
        if: runner.os == 'Linux'
        env:
          CXXFLAGS: -m32
        run: python3 -B tests/BMDCollisionArguments.py --generator Ninja --architecture Win32
      - name: Verificar reproduccion de destellos (Windows x86 y x64)
        if: runner.os == 'Windows'
        run: |
          python -B tests/EquipmentSpriteReplay.py --architecture Win32
          python -B tests/EquipmentSpriteReplay.py --architecture x64
      - name: Verificar reproduccion de destellos (Linux x64)
        if: runner.os == 'Linux'
        run: python3 -B tests/EquipmentSpriteReplay.py --generator Ninja
      - name: Configurar Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A Win32 -T v143 -DMU_PLATFORM_BACKEND=SDL3
      - name: Verificar punteros de objetos y assets (Windows x64 aislado)
        if: runner.os == 'Windows' && matrix.config == 'Release'
        run: python -B tests/run_pointer_tests.py tests/pointer-tests-windows.txt
      - name: Verificar punteros de objetos y assets (Linux x64 aislado)
        if: runner.os == 'Linux' && matrix.config == 'Release'
        run: python3 -B tests/run_pointer_tests.py tests/pointer-tests-linux.txt
      - name: Configurar ejecutable Linux
        if: runner.os == 'Linux'
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: cmake -S . -B build -G Ninja -DMU_PLATFORM_BACKEND=SDL3 -DMU_PLATFORM_ONLY=OFF -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-x86.cmake -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Verificar crecimiento de recursos
        run: |
          cmake --build build --config ${{ matrix.config }} --target mu_resource_tables_test mu_frame_pointer_set_test mu_server_trust_test mu_secure_channel_test mu_text_core_test mu_text_shaper_test mu_transform_workers_test mu_render_profile_test mu_render_profile_flow_test mu_terrain_draw_flow_test mu_bmd_device_test mu_panel_anchor_test --parallel 4
          ctest --test-dir build -C ${{ matrix.config }} -E bmd_device --output-on-failure
      - name: Verificar BMD con Mesa (sin pantalla física)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MU_REQUIRE_GL_TEST: "1"
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build -C ${{ matrix.config }} -R "^bmd_device$" --output-on-failure
      - name: Diagnóstico gráfico si falla Linux
        if: failure() && runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MU_REQUIRE_GL_TEST: "1"
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s "-screen 0 1280x1024x24" gdb -batch -ex run -ex "thread apply all bt" --args build/mu_bmd_device_test
      - name: Verificar BMD en el driver disponible de Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C ${{ matrix.config }} -R "^bmd_device$" --output-on-failure
      - name: Compilar
        run: cmake --build build --config ${{ matrix.config }} --parallel 4
      - name: Verificar ABI y empaquetar Release Linux
        if: runner.os == 'Linux' && matrix.config == 'Release'
        run: |
          objdump -T build/bin/main > build/symbols.txt
          ldd build/bin/main > build/ldd.txt
          python3 .github/scripts/package_linux.py build dist
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.config == 'Release'
        with:
          name: mu97k-linux-release
          path: |
            client/dist/*
            client/build/symbols.txt
            client/build/ldd.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sdl3-${{ matrix.target.name }}-${{ matrix.config }}
          path: |
            client/bin/Client/main.exe
            client/build/bin/main
            client/build/Testing/Temporary/LastTest.log
          if-no-files-found: error

  # Windows x64 con el render WebGPU: Dawn estático por vcpkg (manifiesto del
  # repo, triplet cmake/triplets/x64-windows-mu). Los binarios de vcpkg se
  # guardan en la caché de Actions; sólo la primera vez se compila Dawn.
  webgpu:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: WebGPU (windows-x64, Release)
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Preparar vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Caché de binarios de vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-x64-windows-mu-${{ hashFiles('client/vcpkg.json', 'client/vcpkg-configuration.json', 'client/cmake/triplets/x64-windows-mu.cmake') }}
          restore-keys: vcpkg-x64-windows-mu-
      - name: Configurar
        run: cmake --preset windows-sdl3-x64-release
      - name: Compilar
        run: cmake --build --preset windows-sdl3-x64-release --parallel 4
      - name: Verificar que no haya DLL propias
        shell: bash
        run: |
          shopt -s nullglob
          dlls=(bin/Client/*.dll)
          if [ ${#dlls[@]} -ne 0 ]; then echo "DLL junto al ejecutable: ${dlls[*]}"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: webgpu-windows-x64-Release
          path: client/bin/Client/main.exe
          if-no-files-found: error

  # Linux x64 (la plataforma principal en Linux): SDL3 con OpenGL y WebGPU.
  # Dawn sale estático de vcpkg sobre Vulkan; los binarios de vcpkg quedan en
  # la caché de Actions y sólo la primera vez se compila Dawn. x86 queda como
  # base histórica sólo con OpenGL (job backend).
  linux-x64:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: Linux x64 (SDL3 + WebGPU, Release)
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libdecor-0-dev wayland-protocols libvulkan-dev ninja-build pkg-config xvfb xauth gdb libgl1-mesa-dri
      - name: Preparar vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Caché de binarios de vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-x64-linux-${{ hashFiles('client/vcpkg.json', 'client/vcpkg-configuration.json') }}
          restore-keys: vcpkg-x64-linux-
      - name: Configurar
        run: cmake --preset linux-x64-release
      - name: Pruebas unitarias
        run: |
          cmake --build build/linux-x64-release --target mu_resource_tables_test mu_frame_pointer_set_test mu_server_trust_test mu_secure_channel_test mu_text_core_test mu_text_shaper_test mu_transform_workers_test mu_render_profile_test mu_render_profile_flow_test mu_terrain_draw_flow_test mu_bmd_device_test mu_panel_anchor_test --parallel 4
          ctest --test-dir build/linux-x64-release -E bmd_device --output-on-failure
      - name: Verificar BMD con Mesa (sin pantalla física)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MU_REQUIRE_GL_TEST: "1"
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build/linux-x64-release -R "^bmd_device$" --output-on-failure
      - name: Compilar
        run: cmake --build --preset linux-x64-release --parallel 4
      - name: Verificar ABI y empaquetar
        run: |
          objdump -T build/linux-x64-release/bin/main > build/linux-x64-release/symbols.txt
          ldd build/linux-x64-release/bin/main > build/linux-x64-release/ldd.txt
          python3 .github/scripts/package_linux.py build/linux-x64-release dist --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: mu97k-linux-x64-release
          path: |
            client/dist/*
            client/build/linux-x64-release/symbols.txt
            client/build/linux-x64-release/ldd.txt
          if-no-files-found: error

  # Windows x64 con MinGW-w64 (issue #23), en compilación cruzada desde Linux:
  # SDL3 y OpenGL, sin WebGPU. El exe sale estático: no tiene que pedir las DLL
  # del toolchain.
  mingw:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: MinGW (windows-x64, Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Instalar MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix ninja-build
      - name: Configurar
        run: cmake --preset mingw-x64-release
      - name: Compilar
        run: cmake --build --preset mingw-x64-release --target mu97k --parallel 4
      - name: Verificar que no dependa de las DLL de MinGW
        run: |
          set -e
          found=0
          for exe in $(find build/mingw-x64-release/bin -name '*.exe'); do
            dlls=$(x86_64-w64-mingw32-objdump -p "$exe" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')
            echo "$exe: $dlls"
            if echo "$dlls" | grep -qiE 'libstdc|libgcc|libwinpthread'; then found=1; fi
          done
          [ "$found" = 0 ]

  # Windows x64 con MinGW-w64 y WebGPU: Dawn por vcpkg sólo con el backend
  # Vulkan (triplet cmake/triplets/x64-mingw-mu). Corre en Debian 13 porque
  # Dawn necesita MinGW-w64 12 o más nuevo (onecore_apiset), y Ubuntu 24.04
  # trae el 11. Los binarios de vcpkg quedan en la caché de Actions; sólo la
  # primera vez se compila Dawn.
  mingw-webgpu:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    name: MinGW (windows-x64, WebGPU)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      # Dentro del contenedor, github.workspace es la ruta del host: las rutas
      # salen de GITHUB_WORKSPACE.
      - name: Instalar MinGW-w64 y herramientas
        working-directory: .
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-cache" >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++ g++-mingw-w64-x86-64-posix ninja-build cmake git ca-certificates curl zip unzip tar pkg-config python3 python3-venv
      - uses: actions/checkout@v5
      - name: Preparar vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Caché de binarios de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-mingw-mu-${{ hashFiles('client/vcpkg.json', 'client/vcpkg-configuration.json', 'client/cmake/triplets/x64-mingw-mu.cmake', 'client/cmake/triplets/mingw-include/**') }}
          restore-keys: vcpkg-x64-mingw-mu-
      - name: Configurar
        run: cmake --preset mingw-x64-webgpu-release
      - name: Compilar
        run: cmake --build --preset mingw-x64-webgpu-release --target mu97k --parallel 4
      - name: Verificar que no dependa de las DLL de MinGW
        run: |
          set -e
          dlls=$(x86_64-w64-mingw32-objdump -p build/mingw-x64-webgpu-release/bin/main.exe | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')
          echo "main.exe: $dlls"
          if echo "$dlls" | grep -qiE 'libstdc|libgcc|libwinpthread'; then exit 1; fi

  # Resultado del workflow: OK si compiló bien o si no hacía falta compilar.
  # Es el check que exige la regla de main (una matriz salteada no reporta sus
  # checks con nombre propio).
  result:
    name: Client
    if: always()
    # MinGW queda fuera: depende de bajar paquetes de apt y si los mirrors de
    # Ubuntu no responden (2026-11-11) tumbaba el check obligatorio. Sigue
    # corriendo y se ve en el PR, pero no bloquea el merge.
    needs: [changes, backend, webgpu, linux-x64]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verificar resultado
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
