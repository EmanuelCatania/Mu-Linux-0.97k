name: Server
on:
  pull_request:
  # Las ramas de tema compilan por su PR; un push a esas ramas no duplica la
  # ejecución.
  push:
    branches: [ "main", "fase/*" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Qué carpetas tocó el cambio. Los jobs de compilación se saltean si no hace
  # falta; el job de resultado del final es el que exige la regla de main.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/server.yml'

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows-2022, preset: windows-x86 }
          - { os: windows-2022, preset: windows-x64 }
          - { os: ubuntu-24.04, preset: linux-x64 }
          - { os: ubuntu-24.04-arm, preset: linux-arm64 }
        config: [debug, release]
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - name: Instalar la API en C de MySQL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
      - name: Configurar
        run: cmake --preset ${{ matrix.target.preset }}-${{ matrix.config }}
      - name: Compilar
        run: cmake --build --preset ${{ matrix.target.preset }}-${{ matrix.config }} --parallel 2
      - name: Verificar paquete de mass teleport
        if: matrix.config == 'release'
        run: python -B tests/recall_packet_layout.py --architecture ${{ matrix.target.preset == 'windows-x64' && 'x64' || 'Win32' }}

  # Windows con MinGW-w64 (issue #23), en compilación cruzada desde Linux.
  # Los .exe salen estáticos: no tienen que pedir las DLL del toolchain.
  mingw:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: MinGW (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, prefix: x86_64-w64-mingw32 }
          - { arch: x86, prefix: i686-w64-mingw32 }
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - name: Instalar MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix g++-mingw-w64-i686-posix ninja-build
      - name: Configurar
        run: cmake --preset mingw-${{ matrix.arch }}-release
      - name: Compilar
        run: cmake --build --preset mingw-${{ matrix.arch }}-release --parallel 4
      - name: Verificar que no dependa de las DLL de MinGW
        run: |
          set -e
          found=0
          for exe in $(find out/build/mingw-${{ matrix.arch }}-release/bin -name '*.exe'); do
            dlls=$(${{ matrix.prefix }}-objdump -p "$exe" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')
            echo "$exe: $dlls"
            if echo "$dlls" | grep -qiE 'libstdc|libgcc|libwinpthread'; then found=1; fi
          done
          [ "$found" = 0 ]

  # Resultado del workflow: OK si compiló bien o si no hacía falta compilar.
  # Es el check que exige la regla de main (una matriz salteada no reporta sus
  # checks con nombre propio).
  result:
    name: Server
    if: always()
    needs: [changes, build, mingw]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verificar resultado
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
