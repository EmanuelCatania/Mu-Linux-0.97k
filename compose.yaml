name: mu-097k

services:
  mysql:
    image: mysql:5.7
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SEED_TEST_DATA: ${SEED_TEST_DATA}
    volumes:
      - mu_mysql:/var/lib/mysql
      - ./runtime/server/MySQL/DB/CreateDatabase.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
      - ./deploy/docker/mysql/02-populate.sh:/docker-entrypoint-initdb.d/02-populate.sh:ro
      - ./runtime/server/MySQL/DB/PoblateDatabase.sql:/docker-entrypoint-initdb.d/seed/PoblateDatabase.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  mu-server:
    build:
      context: .
      dockerfile: deploy/docker/server/Dockerfile
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      PUBLIC_IP: ${PUBLIC_IP}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "44405:44405/tcp"
      - "55601:55601/udp"
      - "55901:55901/tcp"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 44405 && nc -z 127.0.0.1 55901"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - default

  mu-web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      WEB_PORT: ${WEB_PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      TRUST_PROXY: ${TRUST_PROXY}
      TZ: ${TZ}
      TIMEZONE: ${TIMEZONE}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8085:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - default

volumes:
  mu_mysql:
